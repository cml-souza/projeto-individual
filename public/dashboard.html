<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Métricas</title>
    <link rel="stylesheet" href="css/styles-d.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="nav-side">
                <h2>Dashboard</h2>
                <a href="galeria.html"><h3>Galeria</h3></a>
                <a href="#"><h3>Favoritos</h3></a>
                <a href="index.html"><h3>Sair</h3></a>
            </div>
        </div>
        <div class="dashboard">

            <!-- KPIs -->
            <div class="kpis">
            
                <div class="card-kpi">
                    <div class="kpi-info">
                        <h3>Total de Memórias</h3>
                        <span id="span_total">-</span>
                    </div>
            
                    <div class="kpi-icon">📸</div>
                </div>
            
                <div class="card-kpi">
                    <div class="kpi-info">
                        <h3>Favoritos</h3>
                        <span id="span_favoritos">-</span>
                    </div>
            
                    <div class="kpi-icon">⭐</div>
                </div>
            
                <div class="card-kpi">
                    <div class="kpi-info">
                        <h3>Músicas Salvas</h3>
                        <span id="span_musicas">-</span>
                    </div>
            
                    <div class="kpi-icon">🎵</div>
                </div>
            
                <div class="card-kpi">
                    <div class="kpi-info">
                        <h3>Taxa Favoritados</h3>
                        <span id="span_taxa">-</span>
                    </div>
            
                    <div class="kpi-icon">📈</div>
                </div>
            
            </div>

            <!-- GRÁFICOS -->
            <div class="graficos">

        <div class="grafico-card">
            <h2>Distribuição de Momentos Favoritados</h2>
            <canvas id="graficoPizza"></canvas>
        </div>

        <div class="grafico-card">
            <h2>Momentos Registrados por Mês</h2>
            <canvas id="graficoBarra"></canvas>
        </div>

        <div class="grafico-card">
            <h2>Crescimento de Publicações</h2>
            <canvas id="graficoLinha"></canvas>
        </div>

        <div class="grafico-card">
            <h2>Mídias Mais Utilizadas</h2>
            <canvas id="graficoDonut"></canvas>
        </div>

    </div>

        </div>

    </div>
</body>
</html>

<script>

   var usuario_id = sessionStorage.ID_USUARIO;

   function carregarKPI(){

    fetch (`/kpi/total/${usuario_id}`)
        .then(function(resposta) {
            return resposta.json();
        })
        .then(function(dados){
            console.log(dados);
            span_total.innerText = dados[0].total;
        });

    fetch (`/kpi/favoritos/${usuario_id}`)
        .then(function(resposta){
            return resposta.json();
        })
        .then(function(dados){
            span_favoritos.innerText = dados[0].favoritos;
        });

    fetch (`/kpi/musicas/${usuario_id}`)
        .then(function(resposta){
            return resposta.json()
        })
        .then(function(dados){
            span_musicas.innerText = dados[0].musicas;
        });

    fetch (`/kpi/taxa/${usuario_id}`)
        .then(function(resposta){
            return resposta.json()
        })
        .then(function(dados){
            span_taxa.innerText = dados[0].taxa + "%";
        })
   }
   
   window.onload = function(){
        carregarKPI();
        carregarGraficoPizza();
        setInterval(atualizarGraficoPizza, 5000);
        carregarGraficoBarra();
        setInterval(atualizarGraficoBarra, 5000);

   }

   let graficoPizzaChart;

   function carregarGraficoPizza(){

        fetch(`/graficos/distribuicao/${usuario_id}`)
            .then(resposta => resposta.json())
            .then(dados => {
                let favoritos = dados[0].favoritos;
                let naoFavoritos = dados[0].naoFavoritos;

                graficoPizzaChart = new Chart(graficoPizza, {
                    type: 'pie',
                    
                    options: {
                    responsive: true,
                    plugins: {
                     legend: {
                        position: 'bottom',
                    },
                    }
                    },    
                    data: {
                        labels: ['Favoritados', 'Não Favoritos'],
                        datasets: [{
                            data: [favoritos, naoFavoritos],
                            backgroundColor: [
                            '#8d5682',
                            '#d9bfd3'
                        ],

                        borderWidth: 0
                        }],
                    }
                })
            });
   }

    function atualizarGraficoPizza(){
        fetch(`/graficos/distribuicao/${usuario_id}`)
            .then(resposta => resposta.json())
            .then(dados => {
                let favoritos = dados[0].favoritos;
                let naoFavoritos = dados[0].naoFavoritos;

                graficoPizzaChart.data.datasets[0].data = [
                    favoritos,
                    naoFavoritos
                ];
                
                graficoPizzaChart.update();
            });
    }

    let graficoBarraChart;

    function carregarGraficoBarra(){

        fetch(`/graficos/registrosMensal/${usuario_id}`)
            .then(resposta => resposta.json())
            .then(dados => {
                let labels = [];
                let valores = [];

                for (let i = 0; i < dados.length; i++){
                    labels.push("Mês " + dados[i].mes);
                    valores.push(dados[i].quantidade);
                }

                graficoBarraChart = new Chart(graficoBarra, {

                type: 'bar',

                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    }
                },

                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Momentos',
                        data: valores,
                        backgroundColor: '#8d5682',
                        borderWidth: 0
                    }]
                }
            });

        });

    }

    function atualizarGraficoBarra(){
        fetch(`/graficos/r_mensal/${usuario_id}`)
            .then(resposta => resposta.json())
            .then(dados => {
                let labels = [];
                let valores = [];

                for (let i = 0; i < dados.length; i++){
                    labels.push("Mês " + dados[i].mes);
                    valores.push(dados[i].quantidade);
                }

                graficoBarraChart.data.datasets[0].data = [
                    labels,
                    valores
                ]

                graficoBarraChart.update();
            });
    }


</script>
